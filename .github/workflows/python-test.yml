name: Python unittests

on:
  workflow_dispatch:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install poetry wheel setuptools
        python -m pip install --force-reinstall "ruamel.yaml<0.18"
        python -m pip install --no-build-isolation --editable .
    - name: Lint with flake8
      run: |
        python -m pip install flake8
        flake8 FreeTAKServer --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 FreeTAKServer --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        python -m pip install pytest
        pytest --ignore=FreeTAKServer/components/extended/mission/swagger_server/test
